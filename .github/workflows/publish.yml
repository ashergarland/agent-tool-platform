name: Publish

# This exact filename is configured as the npm Trusted Publisher for both packages. Renaming it
# breaks publishing until the npm-side configuration is updated to match.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to test or recover (without the v prefix)'
        required: true
        type: string
      dry_run:
        description: 'Run validation and npm publish --dry-run without publishing'
        required: false
        default: true
        type: boolean
      recover_testkit_only:
        description: 'Recover a partial release where runtime exists and testkit does not'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish
    # GitHub-hosted runners only: npm trusted publishing does not accept self-hosted runners.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Validate the release ref and version
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          EVENT_NAME: ${{ github.event_name }}
          RECOVER_TESTKIT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_testkit_only || false }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Release tags must have the shape v<package-version>; received $REF_NAME."
              exit 1
            fi
            requested="${REF_NAME#v}"
            git fetch --no-tags origin "$DEFAULT_BRANCH"
            release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
            if ! git merge-base --is-ancestor "$release_commit" "origin/$DEFAULT_BRANCH"; then
              echo "::error::Tag $REF_NAME does not point to a commit in $DEFAULT_BRANCH history."
              exit 1
            fi
            source="tag $REF_NAME"
            release_tag="$REF_NAME"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
              echo "::error::Manual dry runs and recoveries must start from $DEFAULT_BRANCH; selected $REF_NAME."
              exit 1
            fi
            requested="$DISPATCH_VERSION"
            if [[ ! "$requested" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Requested version must be an exact package version; received $requested."
              exit 1
            fi
            if [ "$DRY_RUN" != "true" ] && [ "$RECOVER_TESTKIT_ONLY" != "true" ]; then
              echo "::error::workflow_dispatch may only perform a dry run or explicit testkit-only recovery. Normal releases require a pushed tag."
              exit 1
            fi
            release_tag="v$requested"
            if [ "$RECOVER_TESTKIT_ONLY" = "true" ]; then
              git fetch --force --no-tags origin "refs/tags/$release_tag:refs/tags/$release_tag"
              git fetch --no-tags origin "$DEFAULT_BRANCH"
              release_commit="$(git rev-parse "${release_tag}^{commit}")"
              if ! git merge-base --is-ancestor "$release_commit" "origin/$DEFAULT_BRANCH"; then
                echo "::error::Recovery tag $release_tag does not point to a commit in $DEFAULT_BRANCH history."
                exit 1
              fi
              git checkout --detach "$release_commit"
              source="recovery for tag $release_tag"
            else
              source="dry run on $REF_NAME"
            fi
          else
            echo "::error::Unsupported release event: $EVENT_NAME."
            exit 1
          fi

          echo "version=$requested" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Validated $source for version $requested."

      - name: Install a pinned npm that supports trusted publishing
        env:
          # Pinned deliberately. `npm@latest` would make every release depend on whatever npm
          # published that morning, including a major version bump, which is the opposite of what a
          # release job should be: `latest` is already npm 12. This pin is bounded to the npm 11
          # line and is raised in a commit, reviewed like any other change, never silently.
          NPM_VERSION: '11.19.0'
          # OIDC trusted publishing was added in npm 11.5.1. The pin above is well past it, but the
          # floor is still asserted below so that lowering the pin fails loudly rather than
          # producing an ENEEDAUTH at the publish step.
          NPM_TRUSTED_PUBLISHING_MINIMUM: '11.5.1'
        run: |
          set -euo pipefail
          npm install -g "npm@${NPM_VERSION}"
          installed="$(npm --version)"
          if [ "$installed" != "$NPM_VERSION" ]; then
            echo "::error::Expected npm $NPM_VERSION but the runner has $installed."
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$NPM_TRUSTED_PUBLISHING_MINIMUM" "$installed" | sort -V | head -n1)" != "$NPM_TRUSTED_PUBLISHING_MINIMUM" ]; then
            echo "::error::npm $installed cannot perform OIDC trusted publishing; $NPM_TRUSTED_PUBLISHING_MINIMUM or newer is required."
            exit 1
          fi
          echo "npm $installed (trusted publishing requires >= $NPM_TRUSTED_PUBLISHING_MINIMUM)"

      - run: npm ci

      - name: Stamp the release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/stamp-release-version.mjs "$RELEASE_VERSION"

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests and conformance suites with coverage
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm run test:coverage

      - name: Build every package
        run: npm run build

      - name: Package publication smoke test
        run: npm run package:smoke

      - name: Release consistency check
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm run release:check -- "$RELEASE_VERSION"

      - name: Validate repository metadata
        run: npm run metadata:validate

      - name: Inspect registry state
        id: registry
        env:
          EVENT_NAME: ${{ github.event_name }}
          RECOVER_TESTKIT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_testkit_only || false }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          package_exists() {
            local name="$1" output status resolved
            set +e
            output="$(npm view "$name@$VERSION" version --json 2>&1)"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              resolved="$(printf '%s' "$output" | node -e "let input=''; process.stdin.on('data', chunk => input += chunk).on('end', () => process.stdout.write(String(JSON.parse(input))))")"
              if [ "$resolved" != "$VERSION" ]; then
                echo "::error::Registry returned unexpected version $resolved for $name@$VERSION." >&2
                exit 1
              fi
              printf 'true'
              return
            fi
            if printf '%s' "$output" | grep -q 'E404'; then
              printf 'false'
              return
            fi
            echo "::error::Could not query $name@$VERSION: $output" >&2
            exit 1
          }

          runtime_exists="$(package_exists '@agent-tool-platform/runtime')"
          testkit_exists="$(package_exists '@agent-tool-platform/testkit')"
          echo "runtime_exists=$runtime_exists" >> "$GITHUB_OUTPUT"
          echo "testkit_exists=$testkit_exists" >> "$GITHUB_OUTPUT"

          if [ "$runtime_exists" = "false" ] && [ "$testkit_exists" = "false" ]; then
            if [ "$RECOVER_TESTKIT_ONLY" = "true" ]; then
              echo "::error::Testkit-only recovery requires the runtime to exist already."
              exit 1
            fi
            mode="normal"
          elif [ "$runtime_exists" = "true" ] && [ "$testkit_exists" = "true" ]; then
            echo "::error::Version $VERSION is already released; npm versions are immutable."
            exit 1
          elif [ "$runtime_exists" = "true" ] && [ "$testkit_exists" = "false" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$RECOVER_TESTKIT_ONLY" = "true" ]; then
              mode="recover-testkit"
            else
              echo "::error::Partial release detected: runtime@$VERSION exists and testkit@$VERSION does not. Use deliberate workflow_dispatch testkit-only recovery."
              exit 1
            fi
          else
            echo "::error::Broken release state: testkit@$VERSION exists but runtime@$VERSION does not."
            exit 1
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Registry state selected $mode mode for $VERSION."

      - name: Publish the runtime
        id: publish-runtime
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.dry_run) && steps.registry.outputs.mode == 'normal' }}
        run: npm publish --workspace @agent-tool-platform/runtime --access public

      - name: Wait for the exact runtime version
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            output="$(npm view "@agent-tool-platform/runtime@$VERSION" version --json 2>/dev/null || true)"
            resolved="$(printf '%s' "$output" | node -e "let input=''; process.stdin.on('data', chunk => input += chunk).on('end', () => { try { process.stdout.write(String(JSON.parse(input))) } catch {} })")"
            if [ "$resolved" = "$VERSION" ]; then
              echo "@agent-tool-platform/runtime@$VERSION is publicly resolvable."
              exit 0
            fi
            echo "Waiting for runtime@$VERSION registry propagation (attempt $attempt of 18)."
            sleep 10
          done
          echo "::error::runtime@$VERSION was not publicly resolvable after 3 minutes; testkit will not be published."
          exit 1

      - name: Publish the testkit
        id: publish-testkit
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: npm publish --workspace @agent-tool-platform/testkit --access public

      - name: Verify the published testkit
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            published_version="$(npm view "@agent-tool-platform/testkit@$VERSION" version --json 2>/dev/null || true)"
            dependencies="$(npm view "@agent-tool-platform/testkit@$VERSION" dependencies --json 2>/dev/null || true)"
            resolved="$(printf '%s' "$published_version" | node -e "let input=''; process.stdin.on('data', chunk => input += chunk).on('end', () => { try { process.stdout.write(String(JSON.parse(input))) } catch {} })")"
            runtime_dependency="$(printf '%s' "$dependencies" | node -e "let input=''; process.stdin.on('data', chunk => input += chunk).on('end', () => { try { process.stdout.write(JSON.parse(input)['@agent-tool-platform/runtime'] ?? '') } catch {} })")"
            if [ "$resolved" = "$VERSION" ] && [ "$runtime_dependency" = "$VERSION" ]; then
              echo "@agent-tool-platform/testkit@$VERSION is publicly resolvable and depends exactly on runtime@$VERSION."
              exit 0
            fi
            echo "Waiting for testkit@$VERSION registry propagation (attempt $attempt of 18)."
            sleep 10
          done
          echo "::error::testkit@$VERSION and its exact runtime dependency were not publicly resolvable after 3 minutes."
          exit 1

      - name: Create the GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; leaving it unchanged."
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi

      - name: Dry run publication
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          MODE: ${{ steps.registry.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "normal" ]; then
            npm publish --workspace @agent-tool-platform/runtime --access public --dry-run
          fi
          npm publish --workspace @agent-tool-platform/testkit --access public --dry-run
          echo "Dry run only. Nothing was published."

      - name: Report a partial release
        if: ${{ failure() && (steps.registry.outputs.runtime_exists == 'true' || steps.publish-runtime.outcome == 'success') && steps.registry.outputs.testkit_exists != 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## Partial release"
            echo ""
            echo "Runtime $VERSION is published, but this run did not verify testkit $VERSION."
            echo "Use **workflow_dispatch** from the default branch with version \`$VERSION\` and"
            echo "**recover_testkit_only** enabled. Do not republish or independently bump runtime."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarise the release
        if: ${{ success() }}
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          MODE: ${{ steps.registry.outputs.mode }}
          SOURCE: ${{ steps.version.outputs.source }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "## Publication dry run completed"
            elif [ "$MODE" = "recover-testkit" ]; then
              echo "## Partial release recovered"
            else
              echo "## Release published"
            fi
            echo ""
            echo "- Source: $SOURCE"
            echo "- Version: \`$VERSION\`"
            echo "- Mode: \`$MODE\`"
            if [ "$MODE" = "normal" ]; then
              echo "- Runtime: \`@agent-tool-platform/runtime@$VERSION\`"
            else
              echo "- Runtime: already published and verified"
            fi
            echo "- Testkit: \`@agent-tool-platform/testkit@$VERSION\`"
            echo "- Authentication: npm Trusted Publishing (OIDC)"
            if [ "$DRY_RUN" != "true" ]; then
              echo "- GitHub Release: created or already present with generated notes"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
