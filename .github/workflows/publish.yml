name: Publish

# This exact filename is the npm Trusted Publisher identity for established packages and the
# required post-bootstrap identity for the new packages. Renaming it breaks npm-side configuration.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to test or recover (without the v prefix)'
        required: true
        type: string
      dry_run:
        description: 'Run every validation and npm publish --dry-run without publishing'
        required: false
        default: true
        type: boolean
      recover:
        description: 'Resume a verified partial release from its first missing package'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish
    # npm Trusted Publishing accepts GitHub-hosted runners only.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Validate the release ref and version
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          EVENT_NAME: ${{ github.event_name }}
          RECOVER: ${{ github.event_name == 'workflow_dispatch' && inputs.recover || false }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Release tags must have the shape v<package-version>; received $REF_NAME."
              exit 1
            fi
            requested="${REF_NAME#v}"
            git fetch --no-tags origin "$DEFAULT_BRANCH"
            release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
            if ! git merge-base --is-ancestor "$release_commit" "origin/$DEFAULT_BRANCH"; then
              echo "::error::Tag $REF_NAME does not point to a commit in $DEFAULT_BRANCH history."
              exit 1
            fi
            source="tag $REF_NAME"
            release_tag="$REF_NAME"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
              echo "::error::Manual dry runs and recoveries must start from $DEFAULT_BRANCH; selected $REF_NAME."
              exit 1
            fi
            requested="$DISPATCH_VERSION"
            if [[ ! "$requested" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Requested version must be an exact package version; received $requested."
              exit 1
            fi
            if [ "$DRY_RUN" = "true" ] && [ "$RECOVER" = "true" ]; then
              echo "::error::Choose either a dry run or recovery, not both."
              exit 1
            fi
            if [ "$DRY_RUN" != "true" ] && [ "$RECOVER" != "true" ]; then
              echo "::error::workflow_dispatch may only perform a dry run or explicit recovery. Normal releases require a pushed tag."
              exit 1
            fi
            release_tag="v$requested"
            if [ "$RECOVER" = "true" ]; then
              git fetch --force --no-tags origin "refs/tags/$release_tag:refs/tags/$release_tag"
              git fetch --no-tags origin "$DEFAULT_BRANCH"
              release_commit="$(git rev-parse "${release_tag}^{commit}")"
              if ! git merge-base --is-ancestor "$release_commit" "origin/$DEFAULT_BRANCH"; then
                echo "::error::Recovery tag $release_tag does not point to a commit in $DEFAULT_BRANCH history."
                exit 1
              fi
              git checkout --detach "$release_commit"
              source="recovery for tag $release_tag"
            else
              release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
              source="dry run on $REF_NAME"
            fi
          else
            echo "::error::Unsupported release event: $EVENT_NAME."
            exit 1
          fi

          echo "version=$requested" >> "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Validated $source for version $requested at $release_commit."

      - name: Install a pinned npm that supports trusted publishing
        env:
          # The exact npm release is reviewed here rather than changing underneath a release.
          NPM_VERSION: '11.19.0'
          NPM_TRUSTED_PUBLISHING_MINIMUM: '11.5.1'
        run: |
          set -euo pipefail
          npm install -g "npm@${NPM_VERSION}"
          installed="$(npm --version)"
          if [ "$installed" != "$NPM_VERSION" ]; then
            echo "::error::Expected npm $NPM_VERSION but the runner has $installed."
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$NPM_TRUSTED_PUBLISHING_MINIMUM" "$installed" | sort -V | head -n1)" != "$NPM_TRUSTED_PUBLISHING_MINIMUM" ]; then
            echo "::error::npm $installed cannot perform OIDC trusted publishing; $NPM_TRUSTED_PUBLISHING_MINIMUM or newer is required."
            exit 1
          fi
          echo "npm $installed (trusted publishing requires >= $NPM_TRUSTED_PUBLISHING_MINIMUM)"

      - run: npm ci

      - name: Stamp the release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/stamp-release-version.mjs "$RELEASE_VERSION"

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck publishable Platform packages
        run: npm run typecheck:platform

      - name: Platform unit tests and conformance suites with coverage
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm run test:coverage:platform

      - name: Build publishable Platform packages
        run: npm run build:platform

      - name: Package publication smoke test
        run: npm run package:smoke

      - name: Release consistency check
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm run release:check -- "$RELEASE_VERSION"

      - name: Validate repository metadata
        run: npm run metadata:validate

      - name: Inspect and classify registry state
        id: registry
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          EVENT_NAME: ${{ github.event_name }}
          RECOVER: ${{ github.event_name == 'workflow_dispatch' && inputs.recover || false }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          metadata="$(node scripts/release-registry-state.mjs "$VERSION" "$RELEASE_COMMIT" \
            --verification exact-artifact)"
          printf '%s\n' "$metadata" >> "$GITHUB_OUTPUT"
          state="$(printf '%s\n' "$metadata" | sed -n 's/^state=//p')"

          if [ "$DRY_RUN" = "true" ]; then
            mode="dry-run"
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ "$state" = "absent" ]; then
              mode="normal"
            elif [ "$state" = "complete" ]; then
              echo "::error::Version $VERSION is already released; npm versions are immutable."
              exit 1
            else
              echo "::error::Partial release detected for $VERSION. Use deliberate workflow_dispatch recovery."
              exit 1
            fi
          elif [ "$RECOVER" = "true" ]; then
            if [ "$state" = "absent" ]; then
              echo "::error::Recovery requires a non-empty verified publication prefix. Use the release tag for a new release."
              exit 1
            fi
            mode="recovery"
          else
            echo "::error::Invalid release mode."
            exit 1
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Registry state selected $mode mode for $VERSION."

      - name: Publish Runtime
        id: publish-runtime
        if: ${{ steps.registry.outputs.mode != 'dry-run' && steps.registry.outputs.runtime_exists != 'true' }}
        run: npm publish --workspace @agent-tool-platform/runtime --access public

      - name: Wait for the exact Runtime version
        if: ${{ steps.registry.outputs.mode != 'dry-run' }}
        env:
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/release-registry-state.mjs "$VERSION" "$RELEASE_COMMIT" \
            --verification exact-artifact --minimum-prefix 1 --attempts 18 --delay-ms 10000

      - name: Publish Capability Registry
        id: publish-capability-registry
        if: ${{ steps.registry.outputs.mode != 'dry-run' && steps.registry.outputs.capability_registry_exists != 'true' }}
        run: npm publish --workspace @agent-tool-platform/capability-registry --access public

      - name: Wait for the exact Capability Registry version
        if: ${{ steps.registry.outputs.mode != 'dry-run' }}
        env:
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/release-registry-state.mjs "$VERSION" "$RELEASE_COMMIT" \
            --verification exact-artifact --minimum-prefix 2 --attempts 18 --delay-ms 10000

      - name: Publish Agent Kit
        id: publish-agent-kit
        if: ${{ steps.registry.outputs.mode != 'dry-run' && steps.registry.outputs.agent_kit_exists != 'true' }}
        run: npm publish --workspace @agent-tool-platform/agent-kit --access public

      - name: Wait for the exact Agent Kit version
        if: ${{ steps.registry.outputs.mode != 'dry-run' }}
        env:
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/release-registry-state.mjs "$VERSION" "$RELEASE_COMMIT" \
            --verification exact-artifact --minimum-prefix 3 --attempts 18 --delay-ms 10000

      - name: Publish Testkit
        id: publish-testkit
        if: ${{ steps.registry.outputs.mode != 'dry-run' && steps.registry.outputs.testkit_exists != 'true' }}
        run: npm publish --workspace @agent-tool-platform/testkit --access public

      - name: Verify the complete release from npm
        id: verify
        if: ${{ steps.registry.outputs.mode != 'dry-run' }}
        env:
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/release-registry-state.mjs "$VERSION" "$RELEASE_COMMIT" \
            --verification exact-artifact --minimum-prefix 4 --attempts 18 --delay-ms 10000

      - name: Create the GitHub Release
        if: ${{ steps.registry.outputs.mode != 'dry-run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; leaving it unchanged."
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi

      - name: Dry run publication
        if: ${{ steps.registry.outputs.mode == 'dry-run' }}
        run: |
          set -euo pipefail
          npm publish --workspace @agent-tool-platform/runtime --access public --dry-run
          npm publish --workspace @agent-tool-platform/capability-registry --access public --dry-run
          npm publish --workspace @agent-tool-platform/agent-kit --access public --dry-run
          npm publish --workspace @agent-tool-platform/testkit --access public --dry-run
          echo "Dry run only. Nothing was published."

      - name: Report a release interruption
        if: ${{ failure() && steps.registry.outcome == 'success' && steps.registry.outputs.mode != 'dry-run' }}
        env:
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          set +e
          metadata="$(node scripts/release-registry-state.mjs "$VERSION" "$RELEASE_COMMIT" \
            --verification exact-artifact 2>&1)"
          registry_status=$?
          set -e

          {
            if [ "$registry_status" -ne 0 ]; then
              echo "## Release state could not be verified"
              echo ""
              echo "Publication or verification stopped, and the exact npm state did not pass verification."
              echo "Do not publish or recover until the Registry state is investigated."
              echo ""
              echo '```text'
              printf '%s\n' "$metadata"
              echo '```'
            else
              state="$(printf '%s\n' "$metadata" | sed -n 's/^state=//p')"
              if [ "$state" = "absent" ]; then
                echo "## Publication stopped before a verified prefix existed"
                echo ""
                echo "No package at $VERSION was verified on npm. Recovery requires a non-empty prefix."
                echo "Confirm all four versions remain absent, correct the cause, and rerun the failed tag workflow."
              elif [ "$state" = "partial" ]; then
                echo "## Partial release"
                echo ""
                echo "Publication stopped after a verified immutable prefix at $VERSION."
                echo "Re-run **workflow_dispatch** from the default branch with version \`$VERSION\`,"
                echo "**dry_run** disabled, and **recover** enabled. Recovery checks out \`$RELEASE_TAG\`,"
                echo "re-verifies the immutable prefix, and publishes only the missing suffix."
              else
                echo "## npm publication complete; release finalization stopped"
                echo ""
                echo "All four packages at $VERSION are exact on npm."
                echo "Use deliberate recovery to re-verify them and finish GitHub Release creation."
              fi
              echo "Do not republish, force publish, or independently bump any package."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarise the release
        if: ${{ success() }}
        env:
          MODE: ${{ steps.registry.outputs.mode }}
          SOURCE: ${{ steps.version.outputs.source }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            if [ "$MODE" = "dry-run" ]; then
              echo "## Publication dry run completed"
            elif [ "$MODE" = "recovery" ]; then
              echo "## Partial release recovered"
            else
              echo "## Release published"
            fi
            echo ""
            echo "- Source: $SOURCE"
            echo "- Version: \`$VERSION\`"
            echo "- Publish order: Runtime, Capability Registry, Agent Kit, Testkit"
            echo "- Authentication: npm Trusted Publishing (OIDC)"
            if [ "$MODE" != "dry-run" ]; then
              echo "- GitHub Release: created or already present with generated notes"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
