name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Coverage thresholds live in vitest.config.ts and fail the run on their own.
      - name: Unit tests and conformance suites with coverage
        run: npm run test:coverage

      - name: Build every package
        run: npm run build

      # Proves consumers get what the exports map promises: both packages are packed, installed into
      # throwaway projects outside this workspace, and imported there. Deterministic and offline; it
      # never authenticates to npm and never publishes.
      - name: Package publication smoke test
        run: npm run package:smoke

      # Version lockstep, exact testkit -> runtime dependency, and publishable manifest layout.
      - name: Release consistency check
        run: npm run release:check

      - name: Generate the fixture OpenAPI document
        run: npm run openapi:emit

      - name: Validate repository metadata
        run: npm run metadata:validate

      - uses: actions/upload-artifact@v7
        with:
          name: fixture-openapi
          path: openapi.fixture.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info

  windows-runtime:
    name: Windows confined files and scratch
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Typecheck Windows runtime surfaces
        run: npm run typecheck

      - name: Report Windows symlink capability
        shell: pwsh
        run: |
          node -e "const fs=require('node:fs/promises'),os=require('node:os'),p=require('node:path');(async()=>{const base=await fs.mkdtemp(p.join(os.tmpdir(),'atp-symlink-probe-'));try{const target=p.join(base,'target.txt');await fs.writeFile(target,'x');await fs.symlink(target,p.join(base,'link.txt'));await fs.appendFile(process.env.GITHUB_ENV,'ATP_SYMLINK_TESTS_REQUIRED=1'+os.EOL);console.log('Windows final-symlink tests: enabled and required');}catch(error){if(error.code!=='EPERM'&&error.code!=='EACCES')throw error;console.log('Windows final-symlink tests: skipped; symlink privilege unavailable ('+error.code+')');}finally{await fs.rm(base,{recursive:true,force:true});}})().catch(error=>{console.error(error);process.exit(1);})"

      - name: Test Windows RootBoundary and scratch lifecycle
        run: npx vitest run tests/fs.test.ts tests/scratch.test.ts

      - name: Test Windows filesystem conformance
        run: npx vitest run tests/conformance.test.ts -t "root boundary conformance|scratch workspace conformance"

  bicep:
    name: Bicep build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Bicep
        run: az bicep install

      # Every module and the example composition must compile and lint. No deployment is performed:
      # `az deployment group validate` needs a real subscription, and this repository deploys
      # nothing.
      - name: Build and lint every module
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r file; do
            echo "::group::$file"
            az bicep build --file "$file" --stdout > /dev/null || status=1
            az bicep lint --file "$file" || status=1
            echo "::endgroup::"
          done < <(find infra -name '*.bicep' | sort)
          exit "$status"
